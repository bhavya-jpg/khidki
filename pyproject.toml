[project]
name = "khidki"
version = "0.1.0"
description = "Khidki: plans, nudges and verifies classroom ventilation on Delhi's bad-air days."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "boto3==1.43.108",
    "cedarpy==4.12.1",
    "numpy>=2.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
local = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
]
agent = [
    "strands-agents==1.57.2",
]
cloud = [
    "aws-lambda-powertools==3.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "matplotlib==3.11.2",
    "moto[dynamodb]==5.2.3",
]
infra = [
    "aws-cdk-lib==2.272.0",
    "constructs>=10.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "core/khidki_core",
    "data/khidki_data",
    "services/khidki_services",
    "sim/khidki_sim",
    "local/khidki_local",
    "agent/khidki_agent",
    "cloud/khidki_cloud",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["web", "infra/cdk.out", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Devanagari and µ/₂ in strings and comments are intentional

[tool.ruff.lint.per-file-ignores]
"bench/report.py" = ["E501"]  # long Markdown sentences

[tool.ruff.lint.isort]
known-first-party = ["khidki_core", "khidki_data", "khidki_services", "khidki_agent", "khidki_sim", "khidki_local"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["core/khidki_core"]
