name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-extras --all-groups
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check core
        run: uv run mypy
      - name: Test
        run: uv run pytest
