# Local hooks: no network needed (the venue network is slow). Runs on every commit.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run --offline ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: uv run --offline ruff format --check
        language: system
        types: [python]
      - id: mypy-core
        name: mypy (core)
        entry: uv run --offline mypy
        language: system
        pass_filenames: false
        files: ^core/
      - id: web-typecheck
        name: tsc (web)
        entry: bash -c 'cd web && npx tsc -b'
        language: system
        pass_filenames: false
        files: ^web/src/
